name: 'Varbase Media Demo Assets Test Roles'
description: 'Creates the Varbase user roles (site_admin, content_admin, editor, seo_admin) that the Varbase Media default recipe grants media permissions to. On a full Varbase site these roles are provided by the Varbase profile; the Varbase Media Demo Assets automated tests run on the Drupal Standard profile, so this helper recipe creates minimal role entities from its own config/ directory before Varbase Media is installed.'
type: 'Testing'
install:
  - user
